version = 1

; ─────────────────────────────────────────────────────────────
; Global baseline
; ─────────────────────────────────────────────────────────────

[*]

; Let llama.cpp fit as much of the model onto the 3070 as it can.
n-gpu-layers = auto
fit = on
fit-target = 512

; One user / one generation at a time.
parallel = 1

; Use FA whenever the model/backend supports it.
flash-attn = auto

; Keep the large-vocabulary sampler on the backend when supported. Grammar and
; JSON-schema requests automatically fall back to CPU sampling.
backend-sampling = true

; Expand the context size
ctx-size = 65536

; Halves KV cache memory relative to F16, generally harmless.
; Gemma 4 26B and variants (or gemma in general) doesn't like it.
cache-type-k = q8_0
cache-type-v = q8_0

; Reduce the RAM used to cache prompts
cache-ram = 4096
; cache-ram = 0
; cache-idle-slots = false


; Keep checkpoint memory under control.
ctx-checkpoints = 1

; 5800H starting point.
threads = 8
threads-batch = 16


; ─────────────────────────────────────────────────────────────
; Gemma 4 26B-A4B family
; ─────────────────────────────────────────────────────────────

[Gemory-26B-A4B-Q4_K_M]
cache-type-k = f16
cache-type-v = f16

[Orion-26B-A4B-v1f-Q4_K_M]
cache-type-k = f16
cache-type-v = f16

[TheDrummer_Orion-26B-A4B-v1.1-Q4_K_M]
cache-type-k = f16
cache-type-v = f16

[gemma-4-26b-a4b-heretic-styletune-v2-head.i1-Q5_K_S]
cache-type-k = f16
cache-type-v = f16

[Kitchoon-V2-26B-A4B.i1-Q4_K_M]
cache-type-k = f16
cache-type-v = f16
; Somewhat faster prefill
ubatch-size = 1024


; ─────────────────────────────────────────────────────────────
; Qwen3.6 35B-A3B MoE
; ─────────────────────────────────────────────────────────────

[Qwen3.6-35B-A3B-uncensored-heretic-Native-MTP-Preserved-Q3_K_M]
; n-cpu-moe = 24
; spec-type = draft-mtp
; spec-draft-n-max = 2

; [WorldSim-Opus-3.6-35B-A3B.i1-Q4_K_S]
; n-cpu-moe = 24

; ─────────────────────────────────────────────────────────────
; Dense 24B models
; ─────────────────────────────────────────────────────────────

; [Hearthfire-24B.i1-IQ3_XXS]
; ctx-size = 65536

; [Magistry-24B-v1.0.i1-Q4_K_S]
; ctx-size = 32768

; ─────────────────────────────────────────────────────────────
; Skyfall 31B dense
; ─────────────────────────────────────────────────────────────

; [Skyfall-31B-v4.2.i1-IQ3_XXS]
; ctx-size = 16384