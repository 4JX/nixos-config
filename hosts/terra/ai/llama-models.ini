version = 1

; ─────────────────────────────────────────────────────────────
; Global baseline
; ─────────────────────────────────────────────────────────────

[*]

; Let llama.cpp fit as much of the model onto the 3070 as it can.
n-gpu-layers = auto
fit = on
fit-target = 1024

; One user / one generation at a time.
parallel = 1

; Use FA whenever the model/backend supports it.
flash-attn = auto

; Good default for this machine. Individual models override below.
; ctx-size = 32768
ctx-size = 65536

; Halves KV cache memory relative to F16.
cache-type-k = q8_0
cache-type-v = q8_0

; Don't reserve llama-server's default 8 GiB host prompt cache.
; Host RAM is much more useful for model offloading here.
; cache-ram = 4096

; Keep checkpoint memory under control.
ctx-checkpoints = 1

; 5800H starting point.
threads = 8
threads-batch = 16


; ─────────────────────────────────────────────────────────────
; Gemma 4 26B-A4B family
;
; Keep most expert weights in system RAM while allowing
; attention/non-expert tensors to make better use of VRAM.
; Start at 24 and benchmark 18 / 24 / 30 later.
; ─────────────────────────────────────────────────────────────

[Gemory-26B-A4B-Q4_K_M]
cache-type-k = f16
cache-type-v = f16

[Orion-26B-A4B-v1f-Q4_K_M]
cache-type-k = f16
cache-type-v = f16

[TheDrummer_Orion-26B-A4B-v1.1-Q4_K_M]
cache-type-k = f16
cache-type-v = f16

[gemma-4-26b-a4b-heretic-styletune-v2-head.i1-Q5_K_S]
cache-type-k = f16
cache-type-v = f16

[Kitchoon-V2-26B-A4B.i1-Q4_K_M]
cache-type-k = f16
cache-type-v = f16

